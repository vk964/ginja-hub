workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk

  android-aab-workflow:
    name: Android AAB (release bundle)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      # To sign for Google Play: upload a keystore in Codemagic
      # (Team settings > Code signing identities > Android keystores),
      # then uncomment the two lines below with its reference name.
      # android_signing:
      #   - ginja_keystore
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android App Bundle
        script: |
          chmod +x ./gradlew
          ./gradlew bundleRelease -PversionCode=$BUILD_NUMBER
    artifacts:
      - app/build/outputs/**/*.aab
