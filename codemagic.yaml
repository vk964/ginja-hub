workflows:
  android-workflow:
    name: R7 Bet — Release APK + AAB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      android_signing:
        - kalda
      vars:
        AF_HANDOFF_CONFIG_KEY: "p7a39e15d8c024bf691e2"
        APPSFLYER_DEV_KEY: "oGFCBcDPKreTBoQgRTzucF"
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build signed release APK and AAB
        script: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --console=plain
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt

  android-aab-workflow:
    name: Android AAB (release bundle)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      vars:
        AF_HANDOFF_CONFIG_KEY: "p7a39e15d8c024bf691e2"
        APPSFLYER_DEV_KEY: "oGFCBcDPKreTBoQgRTzucF"
      # Keystore uploaded in Codemagic (Team settings > Code signing identities > Android keystores)
      android_signing:
        - kalda
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android App Bundle
        script: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --console=plain
    artifacts:
      - app/build/outputs/**/*.aab
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt
